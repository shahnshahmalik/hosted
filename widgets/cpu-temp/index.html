<style>
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .big { font-family: var(--font-display); font-size: 32px; font-weight: 600; }
  .ok { color: var(--success); } .warn { color: var(--warning); } .crit { color: var(--danger); }
  .small { font-size: 11px; }
</style>
<div id="out" class="muted">Loading…</div>
<script>
  const out = document.getElementById("out"), hist = [];
  hosted.ready.then((h) => {
    let timer;
    async function tick() {
      try {
        const t = (await h.system()).temps;
        if (t.cpu == null) { out.innerHTML = '<span class="muted">No temperature sensor available on this host.</span>'; return; }
        const warn = Number(h.props.warn) || 65, crit = Number(h.props.crit) || 80;
        const f = h.props.unit === "F", show = (c) => (f ? c * 9 / 5 + 32 : c).toFixed(1) + (f ? "°F" : "°C");
        const cls = t.cpu >= crit ? "crit" : t.cpu >= warn ? "warn" : "ok";
        hist.push(t.cpu); if (hist.length > 60) hist.shift();
        const color = cls === "crit" ? "var(--danger)" : cls === "warn" ? "var(--warning)" : "var(--success)";
        out.className = "";
        out.innerHTML = `<div class="top"><span class="big ${cls}">${show(t.cpu)}</span>
            <span class="muted small">${cls === "ok" ? "Normal" : cls === "warn" ? "Warm" : "Hot"}</span></div>
          ${h.sparkline(hist, { width: 300, height: 34, color, min: Math.min(...hist, warn - 25), max: Math.max(...hist, crit) })}
          <div class="small muted">Warn ${show(warn)} · Critical ${show(crit)}${t.sensors.length > 1 ? ` · ${t.sensors.length} sensors` : ""}</div>`;
      } catch (e) { out.innerHTML = `<span class="error">${e.message}</span>`; }
    }
    const start = () => { clearInterval(timer); tick(); timer = setInterval(tick, Math.max(1, Number(h.props.interval) || 3) * 1000); };
    start(); h.onProps(start);
  });
</script>
