<style>
  .rows { display: flex; flex-direction: column; gap: 4px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 8px;
    border-radius: calc(var(--radius) * .5); background: var(--surface); font-variant-numeric: tabular-nums; }
  .code { font-weight: 600; font-family: var(--font-display); }
  .up { color: var(--success); } .down { color: var(--danger); }
  .foot { margin-top: 6px; font-size: 11px; }
</style>
<div id="out" class="muted">Loading…</div>
<script>
  const out = document.getElementById("out");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const day = (d) => d.toISOString().slice(0, 10);

  async function load(h) {
    const base = h.props.base || "EUR", amount = Number(h.props.amount) || 1;
    const symbols = String(h.props.symbols || "").toUpperCase().split(/[\s,]+/).filter((x) => /^[A-Z]{3}$/.test(x) && x !== base);
    if (!symbols.length) { out.innerHTML = '<span class="error">Add currencies in settings</span>'; return; }
    try {
      const q = `from=${base}&to=${symbols.join(",")}`;
      const now = await (await h.fetch(`https://api.frankfurter.dev/v1/latest?${q}`)).json();
      if (!now.rates) throw new Error(now.message || "no rates");
      // Previous business day for the change arrow (ECB doesn't publish on weekends).
      const prevDate = new Date(now.date + "T12:00:00Z"); prevDate.setUTCDate(prevDate.getUTCDate() - 5);
      const hist = await (await h.fetch(`https://api.frankfurter.dev/v1/${day(prevDate)}..${now.date}?${q}`)).json();
      const dates = Object.keys(hist.rates || {}).filter((d) => d < now.date).sort();
      const prev = dates.length ? hist.rates[dates[dates.length - 1]] : {};
      out.className = "";
      out.innerHTML = `<div class="rows">${symbols.filter((s) => now.rates[s]).map((s) => {
        const v = now.rates[s] * amount, p = prev[s] ? prev[s] * amount : null;
        const arrow = p == null || v === p ? "" : v > p ? '<span class="up">▲</span>' : '<span class="down">▼</span>';
        return `<div class="row"><span class="code">${esc(s)}</span><span>${arrow} ${v.toLocaleString(undefined, { maximumFractionDigits: v < 10 ? 4 : 2 })}</span></div>`;
      }).join("")}</div><div class="foot muted">${amount} ${esc(base)} · ECB ${esc(now.date)}</div>`;
    } catch (e) {
      out.innerHTML = `<span class="error">${esc(e.message)}</span>`;
    }
  }
  hosted.ready.then((h) => { load(h); h.onProps(() => load(h)); setInterval(() => load(h), 60 * 60e3); });
</script>
