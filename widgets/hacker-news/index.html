<style>
  ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  li { display: flex; gap: 8px; padding: 5px 6px; border-radius: calc(var(--radius) * .5); cursor: pointer; }
  li:hover { background: var(--surface); }
  .score { min-width: 34px; text-align: right; color: var(--accent); font-variant-numeric: tabular-nums; font-size: 12px; padding-top: 1px; }
  .title { line-height: 1.3; }
  .meta { font-size: 11px; }
</style>
<div id="out" class="muted">Loading…</div>
<script>
  const out = document.getElementById("out");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const API = "https://hacker-news.firebaseio.com/v0";
  let stories = [];

  async function load(h) {
    const feed = ["top", "best", "new", "ask", "show"].includes(h.props.feed) ? h.props.feed : "top";
    const n = Math.max(1, Math.min(30, Number(h.props.count) || 10));
    try {
      const ids = (await (await h.fetch(`${API}/${feed}stories.json`)).json()).slice(0, n);
      stories = (await Promise.all(ids.map(async (id) => (await h.fetch(`${API}/item/${id}.json`)).json()))).filter(Boolean);
      out.className = "";
      out.innerHTML = `<ol>${stories.map((s, i) => {
        const host = s.url ? new URL(s.url).hostname.replace(/^www\./, "") : "news.ycombinator.com";
        return `<li data-i="${i}"><span class="score">${s.score || 0}</span><div><div class="title">${esc(s.title)}</div>
          <div class="meta muted">${esc(host)} · ${s.descendants || 0} comments</div></div></li>`;
      }).join("")}</ol>`;
    } catch (e) {
      out.innerHTML = `<span class="error">${esc(e.message)}</span>`;
    }
  }
  out.addEventListener("click", (e) => {
    const li = e.target.closest("li");
    if (!li) return;
    const s = stories[li.dataset.i];
    hosted.openUrl(s.url || `https://news.ycombinator.com/item?id=${s.id}`).catch(() => {});
  });
  hosted.ready.then((h) => { load(h); h.onProps(() => load(h)); setInterval(() => load(h), 10 * 60e3); });
</script>
