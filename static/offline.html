<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabCanvas · offline</title>
<style>
  html { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #05060a; color: #eef6ff;
    font: 15px system-ui, sans-serif; text-align: center; }
  img { width: 96px; height: 96px; }
  p { color: #7d8aa6; max-width: 22em; line-height: 1.5; }
  button { background: #00f0ff; color: #001014; border: 0; padding: 8px 18px; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon.svg" alt="">
  <h1>Can't reach LabCanvas</h1>
  <p>Your dashboard server isn't answering. Check that it's running and that you're on the right network.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
